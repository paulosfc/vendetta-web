<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2714%27 fill=%27%23111%27/%3E%3Ctext x=%2732%27 y=%2748%27 font-family=%27Arial%27 font-size=%2744%27 font-weight=%27bold%27 text-anchor=%27middle%27 fill=%27%23ff7a00%27%3EV%3C/text%3E%3C/svg%3E">
    <title>Entrar | Vendetta WEB</title>
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <link rel="stylesheet" href="assets/css/login.css">
</head>

<body class="login-page">

    <main class="login-card">

        <div class="logo login-brand">

            <span>VENDETTA</span>
            <small>WEB</small>

        </div>

        <h1>Acessar sistema</h1>
        <p class="login-sub">Entre com seu e-mail e senha para continuar.</p>

        <form id="loginForm" novalidate>

            <div class="form-group">

                <label for="email">E-mail</label>
                <input type="email" id="email" autocomplete="username" autofocus>

            </div>

            <div class="form-group">

                <label for="senha">Senha</label>

                <div class="password-wrap">

                    <input type="password" id="senha" autocomplete="current-password">
                    <button type="button" id="toggleSenha" class="toggle-senha" aria-label="Mostrar senha">👁</button>

                </div>

            </div>

            <label class="login-check">

                <input type="checkbox" id="manterConectado"> Manter conectado

            </label>

            <p id="loginErro" class="login-erro hidden" role="alert"></p>
            <button type="submit" id="btnEntrar" class="btn-primary">Entrar</button>

        </form>

    </main>

    <p class="login-footer">VENDETTA © 2026</p>


    <script src="assets/js/config.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/login.js"></script>
    
</body>

</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar | Vendetta WEB</title>
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <link rel="stylesheet" href="assets/css/login.css">
</head>
<body class="login-page">
    <main class="login-card">
        <div class="logo login-brand">
            <span>VENDETTA</span>
            <small>WEB</small>
        </div>
        <h1>Acessar sistema</h1>
        <p class="login-sub">Entre com seu usuário e senha para continuar.</p>

        <form id="loginForm" novalidate>
            <div class="form-group">
                <label for="usuario">Usuário</label>
                <input type="text" id="usuario" autocomplete="username" autofocus>
            </div>
            <div class="form-group">
                <label for="senha">Senha</label>
                <div class="password-wrap">
                    <input type="password" id="senha" autocomplete="current-password">
                    <button type="button" id="toggleSenha" class="toggle-senha" aria-label="Mostrar senha">👁</button>
                </div>
            </div>
            <label class="login-check">
                <input type="checkbox" id="manterConectado"> Manter conectado
            </label>
            <p id="loginErro" class="login-erro hidden" role="alert"></p>
            <button type="submit" id="btnEntrar" class="btn-primary">Entrar</button>
        </form>
    </main>
    <p class="login-footer">VENDETTA © 2026</p>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/login.js"></script>
</body>
</html>
